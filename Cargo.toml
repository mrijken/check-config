[package]
name = "check-config"
version = "0.9.14"
edition = "2024"
description = "Check configuration files."
documentation = "https://check-config.readthedocs.io"
readme = "README.md"
homepage = "https://pypi.org/project/check-config/"
repository = "https://github.com/mrijken/check-config"
license = "MIT"
keywords = ["automation", "configuration"]
exclude = [".github/*", "videos/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "check-config"

[dependencies]
clap = { version = "4.6.10", features = ["env"] }
clap-verbosity-flag = "3.0.4"
derive_more = { version = "2.1.1", default-features = false, features = [
    "as_ref",
    "display",
    "from",
] }
dir-diff = "0.3.3"
dircpy = { version = "0.3.21", default-features = false }
dirs = "7.0.0"
env_logger = { version = "0.11.12", default-features = false }
rustls = "0.23.46"
flate2 = "1.1.11"
git2 = "0.21.0"
log = "0.4.35"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = [
    "default-tls",
    "blocking",
] }
serde = { version = "1.0", default-features = false }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
similar = "3.2.1"
tar = "0.4.46"
tempfile = { version = "3.27.0", default-features = false }
test-log = { version = "0.2.21", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
toml = { version = "1.2.3+spec-1.1.0", default-features = false }
toml_edit = "0.25.21+spec-1.1.0"
url = { version = "2.5.9", default-features = false }
zip = "9.8.2"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
